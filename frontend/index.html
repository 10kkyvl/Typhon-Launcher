<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/typhon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typhon</title>
    <!-- The dark theme's --bg before any stylesheet; main.ts swaps in the colour a seamless restart
         hands over and removes this once it is not needed. -->
    <style id="boot-bg">
      html,
      body {
        background: #090d17;
      }
    </style>
    <!-- The in-game overlay window loads this page too and must stay transparent from its first frame. -->
    <script>
      if (new URLSearchParams(location.search).has('overlay')) document.getElementById('boot-bg')?.remove();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
