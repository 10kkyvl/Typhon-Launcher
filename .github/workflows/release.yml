# Reproducible release pipeline for the Typhon launcher.
#
# Trigger: push of a `v*` tag, or manual `workflow_dispatch`.
# Builds the Windows installer, signs the self-update manifest, and uploads
# both to the Garage/S3-compatible object store the launcher checks for
# updates.
#
# Required repository secrets:
#   TYPHON_RELEASE_PRIVATE_KEY  base64-encoded ed25519 seed (32 bytes) or
#                               private key (64 bytes) used to sign the
#                               self-update manifest. The matching public key
#                               is embedded in the launcher binary
#                               (internal/selfupdate/model.go).
#   TYPHON_MANIFEST_BASE_URL    base URL the launcher downloads release
#                               artifacts from, e.g.
#                               https://api.typhon-launcher.com/launcher/download
#                               (the backend's public download route; kept as
#                               a secret so no domain is hardcoded here).
#   S3_RELEASES_BUCKET          bucket the release artifacts and manifest are
#                               uploaded to.
#   VPS_SSH_KEY                 private key of the deploy user on the VPS.
#   VPS_KNOWN_HOSTS             known_hosts entry pinning that VPS.
#   VPS_HOST                    VPS hostname.
#   VPS_USER                    deploy user on the VPS.
#   SITE_DISPATCH_TOKEN         optional fine-grained token carrying
#                               "Actions: read and write" on the website
#                               repository. With it the site republishes the
#                               download facts as soon as the manifest is up;
#                               without it the site picks them up on its own
#                               hourly check.
#
# Garage is not reachable from the runner: its S3 port stays firewalled and
# runs without TLS. Publishing therefore copies the files to the VPS over SSH
# and uploads them from there over loopback, so the object-store credentials
# never leave the server -- they are read from /opt/typhon-backend/.env.
#
# When that .env also names a Cloudflare R2 store (RELEASES_S3_*), the same
# files go there too: a backend configured with it redirects downloads to R2,
# one without it still serves Garage, so either can be live during the move.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notes:
        description: One-line summary for the update banner; defaults to the summary of the top CHANGELOG.md entry
        required: false
        default: ""
      skip_deltas:
        description: Ship the full installer only, with no patches from earlier releases
        type: boolean
        required: false
        default: false

# Do not interrupt an in-progress publication or let two releases race on latest.
concurrency:
  group: launcher-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: Build the macOS bundle
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          variant: production

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Wails CLI
        uses: ./.github/actions/setup-wails
        with:
          version: v3.0.0-beta.17

      - name: Verify tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\r\n' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match VERSION ($version)" >&2
            exit 1
          fi

      - name: Verify the embedded Win32 bridge is current
        run: go test ./internal/installguard/asset/

      # Только arm64. Универсальный бандл macOS 26 встречает окном «Support
      # Ending for Intel-Based Apps»: система ругается на x86_64-слайс даже
      # тогда, когда приложение стартует нативно. Tahoe — последняя macOS для
      # интеловых маков, поэтому слайс убран, а не спрятан. Раннер macos-latest
      # сам arm64, так что задача собирает нативно.
      - name: Package the arm64 bundle
        env:
          CGO_ENABLED: "1"
        run: wails3 task darwin:package:zip

      - name: Verify the bundle is arm64 and carries no devmock code
        run: |
          set -euo pipefail
          exe="bin/typhon.app/Contents/MacOS/typhon"
          if [ ! -s "$exe" ]; then
            echo "$exe is missing or empty" >&2
            exit 1
          fi
          expected="$(tr -d ' \t\r\n' < VERSION)"
          for key in CFBundleShortVersionString CFBundleVersion; do
            actual=$(/usr/libexec/PlistBuddy -c "Print :$key" bin/typhon.app/Contents/Info.plist)
            [ "$actual" = "$expected" ] || { echo "$key=$actual, expected $expected" >&2; exit 1; }
          done
          archs="$(lipo -archs "$exe")"
          if [ "$archs" != "arm64" ]; then
            echo "bundle must be arm64 only, got: $archs" >&2
            exit 1
          fi
          if LC_ALL=C grep -q "TYPHON_DEVMOCK_ENABLED" "$exe"; then
            echo "devmock marker found in the release bundle" >&2
            exit 1
          fi

      - name: Upload the bundle for the release job
        uses: actions/upload-artifact@v4
        with:
          name: typhon-darwin-arm64
          path: bin/typhon-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    name: Build the Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          variant: production

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Wails CLI
        uses: ./.github/actions/setup-wails
        with:
          version: v3.0.0-beta.17

      # The pinned official archive comes first: during the 1.1.0 release the
      # Chocolatey feed kept answering 503, and a tag run cannot pick up a
      # workflow fix, so Chocolatey is only the fallback.
      - name: Install NSIS
        shell: pwsh
        env:
          NSIS_VERSION: "3.13"
          NSIS_SHA256: ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION.zip"
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/$env:NSIS_VERSION/nsis-$env:NSIS_VERSION.zip"
          curl.exe -fsSL --retry 4 --retry-all-errors --retry-delay 15 --max-time 300 -o $zip $url
          if ($LASTEXITCODE -eq 0) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
            if ($hash -ne $env:NSIS_SHA256) {
              throw "nsis-$env:NSIS_VERSION.zip has sha256 $hash, expected $env:NSIS_SHA256"
            }
            Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
            $nsisDir = Join-Path $env:RUNNER_TEMP "nsis-$env:NSIS_VERSION"
          } else {
            Write-Warning "NSIS archive download failed with curl exit code $LASTEXITCODE; falling back to Chocolatey"
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "choco install nsis failed with exit code $LASTEXITCODE"
            }
            # "$env:ProgramFiles(x86)" parses as $env:ProgramFiles plus a literal "(x86)".
            $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
            $nsisDir = $roots |
              ForEach-Object { Join-Path $_ 'NSIS' } |
              Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } |
              Select-Object -First 1
          }
          if (-not $nsisDir -or -not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            throw "makensis.exe not found in '$nsisDir' after installing NSIS"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Verify NSIS is on PATH
        shell: pwsh
        run: makensis /VERSION

      - name: Put the unix tools of Git for Windows on PATH
        shell: pwsh
        run: |
          # The windows Taskfile reads the VERSION file with `cat`, which lives
          # in Git's usr/bin and is not always on the runner PATH.
          $usrBin = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (-not (Test-Path (Join-Path $usrBin 'cat.exe'))) {
            throw "cat.exe not found in $usrBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $usrBin

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\r\n' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches VERSION
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$RELEASE_VERSION" ]; then
            echo "tag v$tag does not match VERSION ($RELEASE_VERSION)" >&2
            exit 1
          fi

      # Packaging already builds the application. Verify that same binary below.
      - name: Build and package installer
        shell: bash
        run: wails3 task package

      # Compile with the already-warm build job. Publication needs only this
      # executable, not a second Go installation and a gigabyte of Go caches.
      - name: Test and build the manifest signer
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
        run: |
          go test ./cmd/signrelease ./cmd/mkdelta ./internal/selfupdate/delta
          go build -trimpath -o bin/signrelease.exe ./cmd/signrelease
          go build -trimpath -o bin/mkdelta.exe ./cmd/mkdelta

      - name: Upload the manifest signer
        uses: actions/upload-artifact@v4
        with:
          name: typhon-release-tools
          path: |
            bin/signrelease.exe
            bin/mkdelta.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Verify the Windows binary carries no devmock code
        shell: bash
        run: |
          set -euo pipefail
          exe="bin/typhon.exe"
          if [ ! -s "$exe" ]; then
            echo "$exe is missing or empty" >&2
            exit 1
          fi
          # The marker string exists only in files compiled with the devmock
          # tag (internal/devmock/enabled_devmock.go); a release binary must
          # not contain it.
          if grep -c "TYPHON_DEVMOCK_ENABLED" "$exe" >/dev/null; then
            echo "$exe contains the devmock marker; the release was built with the devmock tag" >&2
            exit 1
          fi

      - name: Verify the Windows binary carries no QA harness
        shell: bash
        run: |
          set -euo pipefail
          exe="bin/typhon.exe"
          if [ ! -s "$exe" ]; then
            echo "$exe is missing or empty" >&2
            exit 1
          fi
          # The marker string exists only in files compiled with the qa tag
          # (qa_on.go), which opens a DevTools port; a release binary must
          # not contain it.
          if grep -c "TYPHON_QA_ENABLED" "$exe" >/dev/null; then
            echo "$exe contains the qa marker; the release was built with the qa tag" >&2
            exit 1
          fi

      - name: Verify installer artifact
        shell: bash
        run: |
          set -euo pipefail
          installer="bin/typhon-amd64-installer.exe"
          if [ ! -s "$installer" ]; then
            echo "$installer is missing or empty" >&2
            exit 1
          fi

      - name: Package the portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'portable'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item bin/typhon.exe (Join-Path $stage 'typhon.exe')
          # An empty marker next to the executable is what switches the
          # launcher to keeping its data in a data folder beside it.
          New-Item -ItemType File -Path (Join-Path $stage 'portable.txt') | Out-Null
          $zip = Join-Path (Get-Location) 'bin/typhon-windows-portable.zip'
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip

      - name: Verify the portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) 'bin/typhon-windows-portable.zip'))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName } | Sort-Object
            if (($names -join ',') -ne 'portable.txt,typhon.exe') {
              throw "unexpected portable archive entries: $($names -join ', ')"
            }
            $marker = $zip.Entries | Where-Object { $_.FullName -eq 'portable.txt' }
            if ($marker.Length -ne 0) { throw "portable.txt must be empty, it is $($marker.Length) bytes" }
            $exe = $zip.Entries | Where-Object { $_.FullName -eq 'typhon.exe' }
            if ($exe.Length -ne (Get-Item bin/typhon.exe).Length) { throw "typhon.exe in the archive differs in size from bin/typhon.exe" }
          } finally {
            $zip.Dispose()
          }

      - name: Upload the installer for the release job
        uses: actions/upload-artifact@v4
        with:
          name: typhon-windows-amd64
          path: |
            bin/typhon-amd64-installer.exe
            bin/typhon-windows-portable.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Sign and publish both platforms
    needs: [macos, windows]
    # Run the tested signer from this run's Windows build, without a Go SDK.
    runs-on: windows-latest
    # 15 minutes covered the publication alone. The patches add three
    # downloads of about 16 MB each, three 7z extractions, three mkdelta runs
    # (2-4 s each when measured, allow 10x on a shared runner) and the signer
    # applying every patch again: about 3-4 minutes in all. 30 keeps that and
    # the slow image pulls of the upload step inside the limit.
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TYPHON_RELEASE_PRIVATE_KEY: ${{ secrets.TYPHON_RELEASE_PRIVATE_KEY }}
      S3_RELEASES_BUCKET: ${{ secrets.S3_RELEASES_BUCKET }}
      MANIFEST_BASE_URL: ${{ secrets.TYPHON_MANIFEST_BASE_URL }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      # The history comes along with its tags: the patch step compares the
      # installer sources of this release with those of each earlier tag.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the tested manifest signer
        uses: actions/download-artifact@v4
        with:
          name: typhon-release-tools
          path: bin

      - name: Verify the manifest signer
        shell: bash
        run: |
          test -s bin/signrelease.exe
          test -s bin/mkdelta.exe

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d ' \t\r\n' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: typhon-windows-amd64
          path: bin

      - name: Verify the Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s bin/typhon-amd64-installer.exe
          test -s bin/typhon-windows-portable.zip

      - name: Download the macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: typhon-darwin-arm64
          path: bin

      - name: Verify the macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          bundle="bin/typhon-darwin-arm64.zip"
          if [ ! -s "$bundle" ]; then
            echo "$bundle is missing or empty" >&2
            exit 1
          fi

      # Launchers that already run a previous release download a patch instead
      # of the whole installer. This step only builds the patches, and for it
      # every missing piece is a missing optimisation: no 7z, an earlier release
      # that cannot be fetched or whose installer differs from this one, or a
      # patch that fails to encode skips that patch with a warning, and those
      # clients take the full installer. Two stops further on are deliberate
      # and do fail the release: signrelease applies every patch again and
      # refuses to sign one that does not rebuild the new typhon.exe, and it
      # refuses a manifest past the 64 KiB that installed launchers accept.
      - name: Build the patches from the previous releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SKIP_DELTAS: ${{ inputs.skip_deltas || vars.SKIP_DELTAS }}
          DELTA_COUNT: "3"
          # A patch replaces typhon.exe and nothing else. What the installer
          # puts or registers besides it comes from these sources, so a change
          # in them needs the installer to run. build/windows/info.json is left
          # out on purpose: it changes with every version and ends up inside
          # the exe.
          INSTALLER_SOURCES: build/windows/nsis build/windows/Taskfile.yml
        run: |
          set -euo pipefail

          : > deltas.txt
          mkdir -p bin/new bin/previous

          if [ "${SKIP_DELTAS:-}" = "true" ]; then
            echo "::warning::skip_deltas is set; this release ships no patches"
            exit 0
          fi

          if ! command -v 7z >/dev/null; then
            echo "::warning::7z is not available; this release ships no patches"
            exit 0
          fi
          if ! 7z e -y -obin/new bin/typhon-windows-portable.zip typhon.exe >/dev/null || [ ! -s bin/new/typhon.exe ]; then
            echo "::warning::typhon.exe could not be taken out of the portable zip; this release ships no patches"
            rm -f bin/new/typhon.exe
            exit 0
          fi

          # Published releases older than this one, newest last. This version
          # is added to the list so that sorting puts the cut in the right
          # place even when a re-run finds its own release already published.
          older="$(
            { gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'; echo "v$RELEASE_VERSION"; } \
              | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' \
              | sort -Vu \
              | awk -v cur="$RELEASE_VERSION" '$0 == cur { exit } { print }' \
              | tail -n "$DELTA_COUNT"
          )"

          for ver in $older; do
            rc=0
            # shellcheck disable=SC2086 # INSTALLER_SOURCES is a list of paths without spaces
            git diff --quiet "v$ver" HEAD -- $INSTALLER_SOURCES || rc=$?
            case "$rc" in
              0) ;;
              1)
                echo "::warning::the installer sources changed since v$ver ($INSTALLER_SOURCES); no patch from it, its clients need the installer"
                continue
                ;;
              *)
                echo "::warning::could not compare the installer sources with v$ver (git diff exited $rc); no patch from it"
                continue
                ;;
            esac

            dest="bin/previous/$ver"
            mkdir -p "$dest"
            # The portable zip exists from 1.2.0 on; every release has the
            # installer, which 7-Zip opens as an NSIS archive.
            if gh release download "v$ver" -p typhon-windows-portable.zip -D "$dest" 2>/dev/null; then
              7z e -y -o"$dest" "$dest/typhon-windows-portable.zip" typhon.exe >/dev/null || true
            elif gh release download "v$ver" -p typhon-amd64-installer.exe -D "$dest" 2>/dev/null; then
              7z e -y -o"$dest" "$dest/typhon-amd64-installer.exe" typhon.exe >/dev/null || true
            fi
            if [ ! -s "$dest/typhon.exe" ]; then
              echo "::warning::no launcher found for $ver; no patch from it"
              continue
            fi
            patch="bin/typhon-${ver}-to-${RELEASE_VERSION}.delta"
            if ./bin/mkdelta.exe -old "$dest/typhon.exe" -new bin/new/typhon.exe -out "$patch"; then
              echo "from=$ver,old=$dest/typhon.exe,patch=$patch" >> deltas.txt
            else
              echo "::warning::could not build a patch from $ver; no patch from it"
            fi
          done

          echo "patches for: $(cut -d, -f1 deltas.txt | tr '\n' ' ')"

      - name: Build and sign the self-update manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          delta_flags=()
          while IFS= read -r spec; do
            if [ -n "$spec" ]; then
              delta_flags+=(-delta "$spec")
            fi
          done < deltas.txt

          exe_field=""
          if [ -s bin/new/typhon.exe ]; then
            exe_field=",exe=bin/new/typhon.exe"
          fi

          ./bin/signrelease.exe \
            -version "$RELEASE_VERSION" \
            -notes "$RELEASE_NOTES" \
            -changelog CHANGELOG.md \
            -base-url "$MANIFEST_BASE_URL" \
            -out manifest.json \
            -artifact "os=windows,arch=amd64,kind=installer,path=bin/typhon-amd64-installer.exe,portable=bin/typhon-windows-portable.zip${exe_field}" \
            ${delta_flags[@]+"${delta_flags[@]}"} \
            -artifact "os=darwin,arch=arm64,kind=bundle,path=bin/typhon-darwin-arm64.zip"

          # A launcher older than 0.5.0 validates every artifact in the
          # manifest and knows only kind=installer, so the macOS bundle makes
          # it reject the whole document as corrupt and no update is offered
          # at all. Those clients get their own signed manifest carrying just
          # the installer; the backend picks between the two by the version
          # the client sends in X-Typhon-Version.
          ./bin/signrelease.exe \
            -version "$RELEASE_VERSION" \
            -notes "$RELEASE_NOTES" \
            -changelog CHANGELOG.md \
            -base-url "$MANIFEST_BASE_URL" \
            -out manifest-legacy.json \
            -artifact "os=windows,arch=amd64,kind=installer,path=bin/typhon-amd64-installer.exe"

      - name: Publish installer and manifest over SSH
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/publish
          chmod 600 ~/.ssh/publish
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          remote_dir="/tmp/typhon-release-${RELEASE_VERSION}-${GITHUB_RUN_ID}"

          cat > publish-remote.sh <<'REMOTE'
          set -euo pipefail
          remote_dir="$1"
          version="$2"
          bucket_override="$3"

          set -a
          . /opt/typhon-backend/.env
          set +a

          bucket="${bucket_override:-${S3_RELEASES_BUCKET:-typhon-releases}}"

          run_aws() {
            docker run --rm --network host \
              -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" \
              -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
              -e AWS_DEFAULT_REGION="${S3_REGION:-garage}" \
              -v "$remote_dir":/data \
              amazon/aws-cli:2.36.30@sha256:da37c08f8e00a64c09acd46e8ce5c3dd30b291046029def45566aa9ccd7b398b "$@"
          }

          run_aws s3 cp /data/typhon-amd64-installer.exe \
            "s3://$bucket/launcher/releases/$version/typhon-amd64-installer.exe" \
            --endpoint-url http://127.0.0.1:3900

          run_aws s3 cp /data/typhon-darwin-arm64.zip \
            "s3://$bucket/launcher/releases/$version/typhon-darwin-arm64.zip" \
            --endpoint-url http://127.0.0.1:3900

          run_aws s3 cp /data/typhon-windows-portable.zip \
            "s3://$bucket/launcher/releases/$version/typhon-windows-portable.zip" \
            --endpoint-url http://127.0.0.1:3900

          # Patches go up before any manifest that names them.
          patches=()
          for path in "$remote_dir"/*.delta; do
            if [ -e "$path" ]; then
              patches+=("$(basename "$path")")
            fi
          done
          for file in ${patches[@]+"${patches[@]}"}; do
            run_aws s3 cp "/data/$file" \
              "s3://$bucket/launcher/releases/$version/$file" \
              --endpoint-url http://127.0.0.1:3900
          done

          if [ -n "${RELEASES_S3_ENDPOINT:-}" ]; then
            r2_bucket="${RELEASES_S3_BUCKET:?RELEASES_S3_ENDPOINT is set without RELEASES_S3_BUCKET}"
            run_r2() {
              docker run --rm \
                -e AWS_ACCESS_KEY_ID="$RELEASES_S3_ACCESS_KEY" \
                -e AWS_SECRET_ACCESS_KEY="$RELEASES_S3_SECRET_KEY" \
                -e AWS_DEFAULT_REGION="${RELEASES_S3_REGION:-auto}" \
                -v "$remote_dir":/data \
                amazon/aws-cli:2.36.30@sha256:da37c08f8e00a64c09acd46e8ce5c3dd30b291046029def45566aa9ccd7b398b "$@" \
                --endpoint-url "https://$RELEASES_S3_ENDPOINT"
            }

            for file in typhon-amd64-installer.exe typhon-darwin-arm64.zip typhon-windows-portable.zip ${patches[@]+"${patches[@]}"}; do
              run_r2 s3 cp "/data/$file" \
                "s3://$r2_bucket/launcher/releases/$version/$file" \
                --cache-control "public, max-age=31536000, immutable"
            done
            for file in manifest.json manifest-legacy.json; do
              run_r2 s3 cp "/data/$file" \
                "s3://$r2_bucket/launcher/$file" \
                --content-type application/json \
                --cache-control "no-cache, no-store, must-revalidate"
            done
          else
            echo "::warning::RELEASES_S3_ENDPOINT is not set in /opt/typhon-backend/.env; this release is in Garage only, and a backend serving releases from R2 will not see it"
          fi

          run_aws s3 cp /data/manifest.json \
            "s3://$bucket/launcher/manifest.json" \
            --endpoint-url http://127.0.0.1:3900 \
            --cache-control "no-cache, no-store, must-revalidate"

          run_aws s3 cp /data/manifest-legacy.json \
            "s3://$bucket/launcher/manifest-legacy.json" \
            --endpoint-url http://127.0.0.1:3900 \
            --cache-control "no-cache, no-store, must-revalidate"

          rm -rf "$remote_dir"
          REMOTE

          shopt -s nullglob
          patches=(bin/*.delta)
          shopt -u nullglob

          ssh -i ~/.ssh/publish "$VPS_USER@$VPS_HOST" "mkdir -p '$remote_dir'"
          scp -i ~/.ssh/publish \
            bin/typhon-amd64-installer.exe \
            bin/typhon-darwin-arm64.zip \
            bin/typhon-windows-portable.zip \
            ${patches[@]+"${patches[@]}"} \
            manifest.json \
            manifest-legacy.json \
            publish-remote.sh \
            "$VPS_USER@$VPS_HOST:$remote_dir/"
          ssh -i ~/.ssh/publish "$VPS_USER@$VPS_HOST" \
            "bash '$remote_dir/publish-remote.sh' '$remote_dir' '$RELEASE_VERSION' '$S3_RELEASES_BUCKET'"

      - name: Ask the website to republish the download facts
        shell: bash
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE_REPOSITORY: ${{ vars.SITE_REPOSITORY || '10kkyvl/typhon-site' }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "SITE_DISPATCH_TOKEN is unset; the site picks this release up on its hourly check"
            exit 0
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SITE_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "asked $SITE_REPOSITORY to deploy $RELEASE_VERSION"

      # Runs last on purpose: the launcher updates itself from the manifest
      # published above, so a hiccup here must not fail a release that already
      # shipped. The GitHub release is the second way to get the installer,
      # for people who would rather download it from the repository.
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Prints the body of one "## <version> — <date>" entry: everything
          # up to the next release heading.
          entry() {
            awk -v want="$1" '
              /^## / {
                if (found) exit
                if ($2 == want) { found = 1; next }
              }
              found { print }
            ' "$2"
          }

          ru="$(entry "$RELEASE_VERSION" CHANGELOG.md)"
          en="$(entry "$RELEASE_VERSION" CHANGELOG.en.md)"

          if [ -z "$(printf '%s' "$ru" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no entry for $RELEASE_VERSION" >&2
            exit 1
          fi
          if [ -z "$(printf '%s' "$en" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.en.md has no entry for $RELEASE_VERSION" >&2
            exit 1
          fi

          {
            printf '## Что нового\n\n%s\n' "$ru"
            printf '\n---\n\n'
            printf "## What's new\n\n%s\n" "$en"
            printf '\n---\n\n'
            printf 'Windows 10+ x64. Скачайте `typhon-amd64-installer.exe` ниже.\n'
            printf 'Установленный лаунчер обновится сам.\n\n'
            printf 'Windows 10+ x64. Download `typhon-amd64-installer.exe` below.\n'
            printf 'An installed launcher updates itself.\n\n'
            printf 'Без установки: распакуйте `typhon-windows-portable.zip` в любую папку, данные лежат рядом в `data`.\n'
            printf 'No install: unpack `typhon-windows-portable.zip` into any folder; the data stays beside it in `data`.\n\n'
            printf 'macOS 13+ Apple Silicon: `typhon-darwin-arm64.zip`. Для Windows-игр нужен CrossOver.\n'
            printf 'macOS 13+ Apple Silicon: download `typhon-darwin-arm64.zip`. Windows games require CrossOver.\n\n'
            printf 'Контрольные суммы всех файлов — в `SHA256SUMS`: `sha256sum -c SHA256SUMS`.\n'
            printf 'Checksums for every file are in `SHA256SUMS`: `sha256sum -c SHA256SUMS`.\n'
          } > release-body.md

          (cd bin && sha256sum typhon-amd64-installer.exe typhon-darwin-arm64.zip typhon-windows-portable.zip > SHA256SUMS)
          (cd bin && sha256sum -c SHA256SUMS)

          gh release create "$RELEASE_TAG" \
            bin/typhon-amd64-installer.exe \
            bin/typhon-darwin-arm64.zip \
            bin/typhon-windows-portable.zip \
            bin/SHA256SUMS \
            --title "Typhon $RELEASE_VERSION" \
            --notes-file release-body.md
