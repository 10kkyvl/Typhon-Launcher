version: '3'

vars:
  APP_NAME: "typhon"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          DEV: "{{.DEV}}"
          EXTRA_TAGS: "{{.EXTRA_TAGS}}"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  # devmock: a macOS/Linux development build where the Windows-only subsystems
  # (installer runner, game processes, process detection, credential store,
  # desktop shortcuts) are replaced by mocks behind the `devmock` build tag.
  # The tag cannot be combined with GOOS=windows or the production tag:
  # internal/devmock/forbid_devmock.go fails to compile in that case.
  build:devmock:
    summary: Builds a development binary with the Windows-only subsystems mocked (macOS/Linux only)
    platforms: [darwin, linux]
    cmds:
      - task: build
        vars:
          DEV: "true"
          EXTRA_TAGS: devmock

  run:devmock:
    summary: Builds and runs the devmock binary
    platforms: [darwin, linux]
    deps: [build:devmock]
    cmds:
      - task: "{{.GOOS}}:run"

  dev:devmock:
    summary: Runs the application in development mode with the devmock tag
    platforms: [darwin, linux]
    cmds:
      - wails3 dev -config ./build/devmock.yml -port {{.VITE_PORT}}

  test:devmock:
    summary: Runs the Go tests with the devmock tag (the mocks and their seams)
    platforms: [darwin, linux]
    cmds:
      - go test -tags devmock ./internal/...

  lint:install:
    summary: Installs the pinned golangci-lint into $(go env GOPATH)/bin
    status:
      - golangci-lint --version 2>/dev/null | grep -q "version 2.13.1"
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

  lint:
    summary: Runs golangci-lint on the whole module
    deps: [lint:install]
    cmds:
      - golangci-lint run ./...

  lint:new:
    summary: Runs golangci-lint only on changes since REV (default origin/dev)
    deps: [lint:install]
    vars:
      REV: '{{.REV | default "origin/dev"}}'
    cmds:
      - golangci-lint run --new-from-rev={{.REV}} --whole-files=false ./...

  legal:check:
    summary: Fails the build while release-blocking placeholders remain in legal documents
    cmds:
      - go test -tags release -run TestReleaseReady .

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
